# Baseline operating parameters — Rotax 912-class engine.
# Single source of truth for physics_model.py and state_estimator.py.
# Mirrors data/engine_data_generator.py::BASELINE — if you change one,
# change both (or better: make the generator read this file instead).

rpm_idle: 1400
rpm_cruise: 5000
rpm_max_cont: 5500

cht_normal_c: 110
cht_max_c: 150

egt_normal_c: 800
egt_max_c: 900

oil_press_normal_psi: 58
oil_press_min_psi: 22
oil_press_max_psi: 72

oil_temp_normal_c: 100
oil_temp_max_c: 120

fuel_flow_cruise_lph: 15.0
vibration_normal_g: 0.5

# Manifold Absolute Pressure -- load-estimation sensor, added for parity
# with data/engine_data_generator.py's map_inhg field.
map_idle_inhg: 12.0
map_max_inhg: 28.0

# Thermal lag coefficients (exponential smoothing, 0 < alpha <= 1; lower =
# slower/heavier thermal response). Only cht_c and oil_temp_c get this --
# everything else reacts to RPM changes fast enough to treat as instantaneous.
cht_thermal_alpha: 0.03
oil_temp_thermal_alpha: 0.02

# Thermodynamic baseline specs (Rotax 912 UL / ULS 4-stroke aero piston engine)
displacement_l: 1.211      # 1211 cm^3
rated_power_kw: 73.5       # ~100 HP @ 5800 RPM
fuel_lhv_mj_kg: 43.5       # Lower Heating Value for aviation gasoline (MJ/kg)
fuel_density_kg_l: 0.72    # Avgas/Mogas density (kg/L)